<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA RIDE</title>
<style>
:root{--bg:#262626;--card:#333;--card2:#444;--fg:#ececec;--mut:#9a9fa2;--acc:#6fa3a8;--line:#4d4d4d;--ok:#8fd9a8;--bad:#ff5a6e;--btn:#d6d6d6;--tr:#4a4a4a;--edge:#8d8d8d;--onacc:#10181a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-look="dark"]{--bg:#0e0e10;--card:#1b1b1f;--card2:#2a2a30;--line:#2c2c33;--mut:#9a9aa6;--btn:#f0f0f0;--tr:#2a2a30;--edge:#55555e}
:root[data-look="light"]{--bg:#f3f3f5;--card:#fff;--card2:#e9e9ee;--fg:#141416;--mut:#6b6b76;--line:#dcdce2;--ok:#14a05f;--bad:#d93a4a;--btn:#2a2a2e;--tr:#dcdce2;--edge:#a9a9b3;--onacc:#101010}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{color-scheme:dark}:root[data-look="light"]{color-scheme:light}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.14em;font-size:17px}.logo b{color:var(--acc)}
#pill{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--card2);color:var(--mut)}
#pill.on{background:var(--ok);color:var(--onacc)}
main{max-width:560px;margin:0 auto;padding:6px 14px calc(96px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0}
h2{margin:0 0 4px;font-size:18px}h3{margin:0 0 8px;font-size:15px;color:var(--mut);font-weight:600}
p{margin:6px 0;color:var(--mut);font-size:14px}
.btn{display:block;width:100%;border:2px solid var(--btn);border-radius:14px;padding:13px;font:700 16px system-ui;background:transparent;color:var(--fg);cursor:pointer;margin-top:10px}
.btn.sec{border-color:var(--line);color:var(--mut)}.btn[disabled]{opacity:.4}
.row{display:flex;gap:10px}.row>*{flex:1}
.hero{display:flex;align-items:center;gap:16px}
.hero svg{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--card2);color:var(--mut)}
.chip.ok{background:var(--ok);color:var(--onacc)}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}
.bar{height:12px;border-radius:99px;background:var(--card2);overflow:hidden;margin:12px 0 6px}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{border:2px solid transparent;border-radius:16px;padding:8px;background:var(--card2);cursor:pointer;text-align:center;font-size:13px}
.tcard.sel{border-color:var(--acc)}
.tcard svg{width:100%;height:auto;border-radius:10px;display:block;margin-bottom:6px}
.step{display:flex;gap:12px;margin:10px 0;align-items:flex-start}.step em{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--onacc);font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font-size:16px}
input[type=range]{width:100%;accent-color:var(--acc)}
canvas{width:100%;image-rendering:pixelated;background:#000;border-radius:10px;display:block}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.seg button{padding:10px 4px;border-radius:12px;border:2px solid transparent;background:var(--card2);color:var(--fg);font-size:13px}.seg button.sel{border-color:var(--acc)}
.play{display:flex;justify-content:center;gap:18px;margin:18px 0}.play button{width:74px;height:74px;border-radius:50%;border:0;background:var(--card2);color:var(--fg);font-size:26px}.play button.big{background:var(--acc);color:var(--onacc);width:88px;height:88px;font-size:32px}
.warn{background:#ff82001f;border:1px solid var(--acc);color:var(--fg);border-radius:14px;padding:10px 12px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{border:0;background:none;color:var(--mut);padding:10px 2px 8px;font-size:11px}nav button span{display:block;font-size:20px}
nav button.sel{color:var(--acc)}
.small{font-size:12px;color:var(--mut)}
.wcard{background:var(--card2);border-radius:16px;padding:10px;margin:10px 0}.wcard canvas{margin-bottom:8px}.wcard b{font-size:15px}
.fld{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.fld label{font-size:12px;color:var(--mut);display:block}.fld input,.fld select{width:100%;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px}
.err{color:var(--bad);font-size:13px;margin:6px 0}.mini{padding:8px 10px;font-size:13px;margin-top:6px;border-radius:10px}.row3{display:flex;gap:8px}.row3>*{flex:1}
.addrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.addrow button{border:0;border-radius:10px;padding:8px 10px;background:var(--card2);color:var(--fg);font-size:13px}
nav{grid-template-columns:repeat(4,1fr)}nav button{font-size:11px}nav button span{font-size:21px}
.live{padding:10px 8px 6px;background:radial-gradient(120% 100% at 30% 10%,color-mix(in srgb,var(--card) 85%,#fff),var(--card))}
.live svg{width:100%;height:auto;display:block;font-family:"Roboto Condensed","Arial Narrow",system-ui,sans-serif}
.live text{fill:var(--fg)}.live .m{fill:var(--mut)}
.subnav{display:flex;gap:6px;overflow-x:auto;margin:10px 0 2px;padding-bottom:2px;scrollbar-width:none}.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:none;border:2px solid var(--line);background:transparent;color:var(--mut);border-radius:99px;padding:8px 14px;font-size:14px}
.subnav button.sel{border-color:var(--acc);color:var(--fg)}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw button.sel{border-color:var(--fg)}
.tg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.tg button{border:2px solid var(--line);background:transparent;color:var(--mut);border-radius:12px;padding:9px 12px;font-size:14px}.tg button.sel{border-color:var(--acc);color:var(--fg)}
.seg.c5{grid-template-columns:repeat(5,1fr)}.seg.c3{grid-template-columns:repeat(3,1fr)}.seg button{border-color:var(--line);background:transparent;color:var(--mut)}.seg button.sel{color:var(--fg)}
input[type=color]{width:100%;height:48px;border:2px solid var(--line);border-radius:12px;background:var(--card2);padding:4px}
.mrow{display:flex;gap:10px}.mrow button{flex:1;border:2px solid var(--line);background:transparent;color:var(--fg);border-radius:14px;padding:12px;font-size:20px}

.sbar{position:sticky;top:0;z-index:7;display:flex;align-items:center;gap:8px;padding:8px 4px;background:var(--bg)}
.sbar .sname{flex:1;text-align:center;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{border:2px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:7px 10px;font-size:13px;margin:0}
.mini.pri,.stb .pri{border-color:var(--acc);color:var(--fg)}.mini.bad{color:var(--bad)}.mini[disabled]{opacity:.4}
.scv{position:sticky;top:50px;z-index:6;background:var(--bg);padding-bottom:6px}
.scv canvas{border-radius:12px;image-rendering:auto;touch-action:none;background:#000;width:100%;max-width:560px;margin:0 auto;border:1px solid var(--line)}
.stb{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.stb button,.stb select{border:2px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:8px 10px;font-size:14px}.stb button.sel{border-color:var(--acc)}.stb button[disabled]{opacity:.35}
.sp{background:var(--card);border-radius:18px;padding:12px;margin:10px 0}.sph{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;flex-wrap:wrap}.sph span{display:flex;gap:6px;flex-wrap:wrap}
.nfg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}.nf label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}.nf.wide{grid-column:1/-1}
.nf input[type=text],.nf input[type=number],.nf select{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font-size:15px}
.nfr{display:flex;gap:4px}.nfr input{text-align:center;min-width:0}.nfr button{flex:none;width:38px;border:0;border-radius:10px;background:var(--card2);color:var(--fg);font-size:18px}
.swr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sc{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}.sc.sel{border-color:var(--fg);box-shadow:0 0 0 2px var(--acc)}
.cp{width:38px;height:32px;padding:0;border:2px solid var(--line);border-radius:10px;background:none}.cp.sel{border-color:var(--fg)}
.nudge{display:flex;gap:6px;margin:4px 0 10px}.nudge button{flex:1;border:0;border-radius:10px;background:var(--card2);color:var(--fg);padding:9px 0;font-size:16px}
.adv{margin:6px 0;border-top:1px solid var(--line);padding-top:8px}.adv summary{cursor:pointer;color:var(--mut);font-size:14px;padding:4px 0}
.layers{display:flex;flex-direction:column;gap:6px}.layers button{text-align:left;border:2px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:9px 10px;font-size:14px}.layers button.sel{border-color:var(--acc)}.layers button.off{opacity:.45}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.addgrid button{text-align:left;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:10px}.addgrid b{display:block;font-size:15px}.addgrid span{font-size:12px;color:var(--mut)}
.scv canvas{width:min(100%,calc(34vh * 1.3334));height:auto;aspect-ratio:4/3;display:block}
.sp{scroll-margin-top:calc(60px + 34vh + 14px)}
.hintbox{background:color-mix(in srgb,var(--acc) 18%,transparent);border:1px solid var(--acc);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;margin-top:8px}
.pk{width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font-size:15px;min-height:42px}.pk i{color:var(--mut);font-style:normal}
.nv{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--fg);font-size:15px}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheetbox{width:100%;max-height:75vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.sheeth{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheetbox>button{display:block;width:100%;text-align:left;border:2px solid var(--line);background:transparent;color:var(--fg);border-radius:12px;padding:13px 14px;font-size:16px;margin:6px 0}.sheetbox>button.sel{border-color:var(--acc)}
.sheetin{width:100%;padding:14px;border-radius:12px;border:2px solid var(--acc);background:var(--card2);color:var(--fg);font-size:20px}
</style>
</head>
<body>
<header><div class="logo">NOVA <b>RIDE</b></div><div id="pill">Ikke forbundet</div></header>
<main id="view"></main>
<nav id="tabs"></nav>
<script>
// NOVA RIDE widgets 2.0: JSON <-> compact binary (max ~2 KB) understood by the board, plus a canvas renderer
// that draws the same layout in the app (editor preview). The firmware parser (src/WidgetLayout.h) enforces the
// same rules. Keep both in sync. Old (v1) JSON files still compile: they are upgraded on the way.
(function (root) {
  'use strict';
  var TYPES = { text: 1, num: 2, bar: 3, arc: 4, rect: 6, circle: 7, line: 8, button: 9, segbar: 10, spark: 11, dot: 12, icon: 13 };
  var TYPE_ALIAS = { ring: 'arc', modebar: 'modebar' };
  var SRC = { none: 0, speed: 1, power: 2, battery: 3, volt: 4, current: 5, temp: 6, motortemp: 7, trip: 8, total: 9, mode: 10, fault: 11,
              maxspeed: 12, maxpower: 13, minvolt: 14, energy: 15, ridetime: 16,
              ble: 17, phone: 18, limit: 19, demo: 20, alert: 21, regen: 22, moving: 23 };
  var NUMERIC = function (s) { return (s >= 1 && s <= 9) || (s >= 12 && s <= 16); };
  var STATUS = function (s) { return s >= 17 && s <= 23; };
  var PAL = { text: 0, neon: 1, ok: 2, warn: 3, bad: 4, dim: 5, panel: 6, bg: 7, glow: 8, white: 9, black: 10 };
  var FONTS = { '1': 0, '2': 1, '4': 2, '6': 3, '7': 4, '8': 5 };
  var ALIGN = { left: 0, center: 1, right: 2 };
  var ACTIONS = { none: 0, nextpage: 1, prevpage: 2, walk: 3, eco: 4, drive: 5, sport: 6, prevtrack: 7, playpause: 8, nexttrack: 9, settings: 10, messages: 11, music: 12, safety: 13 };
  var ICONS = { bolt: 0, battery: 1, thermo: 2, gauge: 3, warning: 4, lock: 5, phone: 6, light: 7 };
  var OPS = { none: 0, '>': 1, '<': 2, '==': 3, '!=': 4, '>=': 5, '<=': 6 };
  var F = { fill: 1, round: 2, border: 4, knob: 8, ticks: 16, caps: 32, bidir: 64, rev: 128 };
  var LIM = { items: 48, str: 24, strLen: 16, colors: 16, header: 12, itemLen: 32 };
  var V1FONT = { '2': 'two', '4': 'four' };

  function inv(o) { var r = {}; Object.keys(o).forEach(function (k) { r[o[k]] = k; }); return r; }
  function clampi(v, a, b) { v = Math.round(+v); return v < a ? a : v > b ? b : v; }
  function rgb565(hex) { var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3); }

  // v1 file (ring/bar/modebar, fixed top margin) -> v2 object
  function upgrade(w) {
    if (!w || w.v === 2) return w;
    var o = { v: 2, name: w.name, author: w.author, desc: w.desc, pages: 1, items: [] };
    (w.items || []).forEach(function (it) {
      var n = JSON.parse(JSON.stringify(it));
      if (n.t === 'ring') { n.t = 'arc'; n.a0 = 135; n.sweep = 270; n.color2 = 'panel'; }
      if (n.t === 'bar') { n.border = true; n.color2 = 'panel'; }
      if (n.t === 'rect') { n.border = true; n.rad = 4; }
      o.items.push(n);
    });
    return o;
  }

  function compile(w0) {
    var err = [];
    function bad(i, m) { err.push((i < 0 ? '' : 'Element ' + (i + 1) + ': ') + m); }
    if (!w0 || typeof w0 !== 'object') return { ok: false, errors: ['Ingen widget'] };
    var w = upgrade(w0);
    var items = w.items;
    if (!Array.isArray(items) || items.length < 1) return { ok: false, errors: ['Widget skal have mindst ét element'] };
    var pages = clampi(w.pages == null ? 1 : w.pages, 1, 4);
    var strs = [], cols = [], out = [];
    function strIdx(s, i, what) {
      s = String(s == null ? '' : s);
      if (!/^[\x20-\x7E]*$/.test(s)) { bad(i, what + ' må kun have almindelige tegn (ASCII)'); return 255; }
      if (s.length === 0) return 255;
      if (s.length > LIM.strLen - 1) { bad(i, what + ' maks ' + (LIM.strLen - 1) + ' tegn'); return 255; }
      var k = strs.indexOf(s);
      if (k < 0) { if (strs.length >= LIM.str) { bad(i, 'For mange forskellige tekster (maks ' + LIM.str + ')'); return 255; } strs.push(s); k = strs.length - 1; }
      return k;
    }
    function colIdx(c, def, i, what) {
      if (c == null) c = def;
      if (typeof c === 'string' && c.charAt(0) === '#') {
        if (!/^#[0-9a-fA-F]{6}$/.test(c)) { bad(i, what + ': farve skal være #rrggbb'); return 0; }
        var v = rgb565(c), k = cols.indexOf(v);
        if (k < 0) { if (cols.length >= LIM.colors) { bad(i, 'For mange egne farver (maks ' + LIM.colors + ')'); return 0; } cols.push(v); k = cols.length - 1; }
        return 16 + k;
      }
      var p = PAL[c];
      if (p === undefined) { bad(i, what + ': ukendt farve'); return 0; }
      return p;
    }
    var bg = colIdx(w.bg, 'bg', -1, 'Baggrund');
    var expanded = [];
    items.forEach(function (it) {
      if (it && it.t === 'modebar') {                       // old mode buttons: four real buttons along the bottom
        ['walk', 'eco', 'drive', 'sport'].forEach(function (m, k) {
          expanded.push({ t: 'button', x: 4 + k * 79, y: 206, w: 75, h: 30, action: m, text: m.toUpperCase(), font: '2', rad: 9, color: 'text', color2: 'panel' });
        });
      } else expanded.push(it);
    });
    if (expanded.length > LIM.items) return { ok: false, errors: ['Højst ' + LIM.items + ' elementer'] };
    expanded.forEach(function (it, i) {
      var tn = TYPE_ALIAS[it.t] || it.t, t = TYPES[tn];
      if (!t) { bad(i, 'Ukendt type'); return; }
      var s = SRC[it.src == null ? 'none' : it.src];
      var action = 0;
      if (t === 9) { action = ACTIONS[it.action == null ? 'none' : it.action]; if (action === undefined) { bad(i, 'Ukendt handling'); return; } s = action; }
      else if (s === undefined) { bad(i, 'Ukendt kilde'); return; }
      var color = colIdx(it.color, 'text', i, 'Farve'), color2 = colIdx(it.color2, 'panel', i, 'Farve 2');
      var font = FONTS[String(it.font == null ? '2' : it.font)];
      if (font === undefined) { bad(i, 'Ukendt skrifttype (1, 2, 4, 6, 7, 8)'); return; }
      var al = ALIGN[it.align == null ? 'left' : it.align];
      if (al === undefined) { bad(i, 'Ukendt justering'); return; }
      var dp = it.dp == null ? 0 : it.dp | 0;
      if (dp < 0 || dp > 2) { bad(i, 'Decimaler 0-2'); return; }
      var pg = it.page == null ? 15 : (it.page === 'all' ? 15 : it.page | 0);
      if (pg !== 15 && (pg < 0 || pg >= pages)) { bad(i, 'Side findes ikke (siderne er 0-' + (pages - 1) + ')'); return; }
      var x = Math.round(+it.x || 0), y = Math.round(+it.y || 0), wd = Math.round(+it.w || 0), ht = Math.round(+it.h || 0);
      var mn = it.min == null ? 0 : Math.round(+it.min), mx = it.max == null ? 0 : Math.round(+it.max);
      var th = Math.round(+it.rad || 0), a0 = Math.round((((+it.a0 == null || isNaN(+it.a0)) ? 135 : +it.a0) % 360 + 360) % 360 / 2), sw = Math.round((it.sweep == null ? 270 : +it.sweep) / 2);
      var flags = 0;
      Object.keys(F).forEach(function (k) { if (it[k]) flags |= F[k]; });
      var str = strIdx(it.t === 'text' || t === 9 ? it.text : it.unit, i, 'Tekst'), str2 = strIdx(it.pre, i, 'Præfiks');
      if (t === 1) {
        if (s !== 0) bad(i, 'Tekst har ingen kilde');
        if (font > 2) bad(i, 'Tekst kan kun bruge skrift 1, 2 eller 4');
        if (str === 255) bad(i, 'Tekst mangler');
      } else if (t === 2) {
        if (s === 0) bad(i, 'Tal skal have en kilde');
        if (s === SRC.mode && font > 2) bad(i, 'Tilstandsnavn kan kun bruge skrift 1, 2 eller 4');
        if (font > 2 && (str !== 255 || str2 !== 255)) bad(i, 'Skrift 6, 7 og 8 kan kun vise tal - brug en tekst ved siden af i stedet for enhed/præfiks');
      } else if (t === 3) {
        if (!NUMERIC(s)) bad(i, 'Bjælke skal have en talkilde');
        if (mx <= mn) bad(i, 'max skal være større end min');
        if (wd < 4 || wd > 320 || ht < 2 || ht > 200) bad(i, 'Bjælke: bredde 4-320, højde 2-200');
        if (th > Math.min(wd, ht) / 2) bad(i, 'Afrunding er for stor');
      } else if (t === 4) {
        var r = Math.round(+it.r || 0), tk = Math.round(+it.th || 0); wd = r; ht = tk;
        if (!NUMERIC(s)) bad(i, 'Bue skal have en talkilde');
        if (mx <= mn) bad(i, 'max skal være større end min');
        if (r < 8 || r > 160 || tk < 1 || tk >= r) bad(i, 'Bue: radius 8-160, tykkelse 1 til under radius');
        if (sw < 1 || sw > 180) bad(i, 'Bue: åbning 2-360 grader');
      } else if (t === 6) {
        if (wd < 2 || wd > 640 || ht < 2 || ht > 640) bad(i, 'Firkant: bredde og højde 2-640');
        if (th > Math.min(wd, ht) / 2) bad(i, 'Afrunding er for stor');
      } else if (t === 7) {
        var cr = Math.round(+it.r || 0); wd = cr; ht = 0;
        if (cr < 2 || cr > 160) bad(i, 'Cirkel: radius 2-160');
        th = Math.round(+it.th || 0);

// ---------- firmware update ----------
function checkFile(u8,name){
  if(!/\.bin$/i.test(name))return 'Filen skal være en .bin';
  if(u8.length<MINAPP||u8.length>MAXAPP)return 'Størrelsen skal være mellem 64 KB og '+(MAXAPP/1024)+' KB (er '+Math.round(u8.length/1024)+' KB)';
  if(u8[0]!==0xE9||u8[12]!==0||u8[13]!==0)return 'Det ligner ikke en ESP32-app (.bin). Brug NOVA_RIDE_<profil>.bin – ikke .factory.bin';
  return '';
}
async function pickFile(f){
  S.file=null;S.fileInfo=null;S.msg='';
  if(!f){render();return}
  var u8=new Uint8Array(await f.arrayBuffer());
  var bad=checkFile(u8,f.name);
  S.fileInfo={name:f.name,size:u8.length,crc:crc32(u8),bad:bad};
  S.file=bad?null:u8;
  render();
}
async function startUpdate(){
  if(!S.file||!S.conn)return;
  S.busy=true;S.msg='';S.ota={state:0,err:0,recv:0,total:S.file.length};S.t0=Date.now();render();
  try{
    await S.t.ctrl([OP.BEGIN].concat(le32(S.file.length),le32(S.fileInfo.crc)));
    await waitOta(5000);
    if(S.ota.state!==2)throw new Error(ERR[S.ota.err]||'Boardet startede ikke opdateringen');
    var CH=160,sent=0,u=S.file;
    while(sent<u.length){
      if(S.ota.state===5)throw new Error(ERR[S.ota.err]||'Fejl på boardet');
      if(sent-S.ota.recv>=6144){await waitOta(3000);if(sent-S.ota.recv>=6144&&S.ota.state===2){await sleep(50);continue}}
      var end=Math.min(u.length,sent+CH);
      await S.t.data(u.slice(sent,end));
      sent=end;
    }
    var t0=Date.now();
    while(S.ota.state!==4&&S.ota.state!==5&&Date.now()-t0<20000)await waitOta(1000);
    if(S.ota.state===5)throw new Error(ERR[S.ota.err]||'Fejl på boardet');
    S.msg='Opdatering sendt. Boardet genstarter nu.';
  }catch(e){
    S.msg=(e&&e.message)||String(e);
    try{if(S.conn)await S.t.ctrl([OP.ABORT])}catch(x){}
  }
  S.busy=false;render();
}
function paintOta(){
  var b=$('#obar'),t=$('#otxt');if(!b)return;
  var o=S.ota,pct=o.total?Math.floor(o.recv*100/o.total):0;
  b.style.width=pct+'%';
  var el=(Date.now()-(S.t0||Date.now()))/1000,sp=el>0?o.recv/el/1024:0;
  var names=['Klar','Klar','Sender…','Kontrollerer…','Færdig – genstarter','Fejl'];
  t.textContent=names[o.state]+'  '+pct+'%  ('+Math.round(o.recv/1024)+' / '+Math.round(o.total/1024)+' KB'+(sp>0?', '+sp.toFixed(1)+' KB/s':'')+')';
}

async function rebuildImg(){

  var bmp=await createImageBitmap(S.imgFile),c=document.createElement('canvas');c.width=128;c.height=64;
  var g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,128,64);
  var sc=Math.min(128/bmp.width,64/bmp.height),w=bmp.width*sc,h=bmp.height*sc;g.drawImage(bmp,(128-w)/2,(64-h)/2,w,h);

// ----- studio painting and pointer handling
function studioTheme(){return wtheme(S.ed.th>=0?THEMES[S.ed.th]:null)}
function studioPaint(){
  var cv=$('#stcv');if(!cv||!cv.getContext)return;var g=cv.getContext('2d');if(!g)return;
  var E=S.ed,t=(Date.now()-E.t0)/1000,live=NW.sample(t,{still:!E.anim,limit:E.limit}),th=studioTheme();
  try{NW.render(g,S.wid,live,{theme:th,page:E.page,hist:NW.history({_t0:0},60),mode:2,ignoreShow:true})}catch(x){}
  var list=S.wid.items;
  if(E.drag&&E.snap>1){g.fillStyle='rgba(255,255,255,.18)';for(var gx=0;gx<=320;gx+=E.snap*4)for(var gy=0;gy<=240;gy+=E.snap*4)g.fillRect(gx,gy,1,1)}
  g.fillStyle='rgba(255,255,255,.28)';[0,1,2].forEach(function(i){g.fillRect(298+i*6,8,2,2)});
  var it=selItem();
  if(it&&it.t!=='modebar'){var b=NW.bounds(it,g);g.save();g.strokeStyle='#00c8ff';g.lineWidth=1;g.setLineDash([4,3]);g.strokeRect(b.x-1.5,b.y-1.5,b.w+3,b.h+3);g.setLineDash([]);g.fillStyle='#00c8ff';g.beginPath();g.arc(b.x+b.w+1.5,b.y+b.h+1.5,6,0,7);g.fill();g.restore()}
}
function stopStudioLoop(){if(S.ed.raf){clearTimeout(S.ed.raf);S.ed.raf=0}}
function studioLoop(){stopStudioLoop();if(!S.studio||typeof document==='undefined')return;(function f(){if(!S.studio)return;studioPaint();S.ed.raf=setTimeout(f,S.ed.anim?66:400)})()}
function hitTest(px,py,g){
  var E=S.ed,items=S.wid.items,page=E.page;
  for(var i=items.length-1;i>=0;i--){var it=items[i],pg=it.page==null||it.page==='all'?15:it.page;if(pg!==15&&pg!==page)continue;if(it.t==='modebar')continue;var b=NW.bounds(it,g);if(px>=b.x-4&&px<=b.x+b.w+4&&py>=b.y-4&&py<=b.y+b.h+4)return i}
  return -1;
}
function wireStudioCanvas(){
  var cv=$('#stcv');if(!cv||!cv.addEventListener)return;
  var g=cv.getContext('2d');
  function pt(e){var r=cv.getBoundingClientRect(),k=320/r.width;return {x:(e.clientX-r.left)*k,y:(e.clientY-r.top)*k,k:k}}
  cv.addEventListener('pointerdown',function(e){
    e.preventDefault();var p=pt(e),E=S.ed,it=selItem();
    if(it&&it.t!=='modebar'){var b=NW.bounds(it,g);if(Math.hypot(p.x-(b.x+b.w+1.5),p.y-(b.y+b.h+1.5))<14){pushUndo();E.drag={mode:'size',sx:p.x,sy:p.y,o:cloneW(it)};try{cv.setPointerCapture(e.pointerId)}catch(x){}return}}
    var i=hitTest(p.x,p.y,g);
    if(i!==E.sel){E.sel=i;render();studioLoop();scrollPanel()}
    if(i>=0){pushUndo();E.drag={mode:'move',sx:p.x,sy:p.y,o:cloneW(S.wid.items[i]),moved:false};try{cv.setPointerCapture(e.pointerId)}catch(x){}}
  });
  cv.addEventListener('pointermove',function(e){
    var E=S.ed,d=E.drag;if(!d)return;var p=pt(e),it=selItem();if(!it)return;var dx=p.x-d.sx,dy=p.y-d.sy;
    if(d.mode==='move'){it.x=Math.max(-200,Math.min(520,snapv(d.o.x+dx)));it.y=Math.max(-200,Math.min(520,snapv(d.o.y+dy)));d.moved=true}
    else{
      var t=it.t,m=Math.max(dx,dy);
      if(t==='arc'){it.r=Math.max(8,Math.min(160,snapv(d.o.r+m)));if(it.th>=it.r)it.th=it.r-1}
      else if(t==='circle'||t==='dot'){it.r=Math.max(2,Math.min(t==='dot'?40:160,snapv((d.o.r||4)+m)))}
      else if(t==='icon')it.size=Math.max(8,Math.min(96,snapv((d.o.size||24)+m)));
      else if(t==='text'||t==='num'){}
      else{it.w=Math.max(4,Math.min(640,snapv((d.o.w||0)+dx)));if(t!=='line'||d.o.h)it.h=Math.max(t==='line'?0:2,Math.min(640,snapv((d.o.h||0)+dy)))}
    }
    studioPaint();
  });
  function end(){var E=S.ed;if(E.drag){var moved=E.drag.moved||E.drag.mode==='size';E.drag=null;if(moved){render();studioLoop()}else E.undo.pop()}}
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
}
function addItem(t){
  var w=S.wid;if(w.items.length+(t==='modebar'?3:0)>=NW.LIM.items){S.msg='Højst '+NW.LIM.items+' elementer';render();return}
  pushUndo();var n=cloneW(DEF2[t]);if(n.t!=='modebar'&&(S.ed.page>0||w.pages>1))n.page=w.pages>1?S.ed.page:undefined;if(n.page===undefined)delete n.page;
  if(t==='modebar'){var e=expandModes({items:[n]});e.items.forEach(function(x){if(w.pages>1)x.page=S.ed.page;w.items.push(x)});S.ed.sel=w.items.length-1}
  else{w.items.push(n);S.ed.sel=w.items.length-1}
  S.ed.add=false;render();studioLoop();
}

function askText(msg,cur){try{if(typeof prompt==='function')return prompt(msg,cur)}catch(e){}return null}
function getProp(key){
  var w=S.wid,it=selItem();
  if(key==='doc.name')return w.name;if(key==='doc.author')return w.author;if(key==='doc.desc')return w.desc;if(key==='doc.pages')return String(w.pages||1);if(key==='doc.bg')return w.bg||'bg';
  if(key==='ed.snap')return S.ed.snap;if(!it)return null;
  if(key.indexOf('show.')===0){var sh=it.show||{};var k=key.slice(5);return k==='src'?(sh.src||''):k==='op'?(sh.op||'>'):(sh.val==null?0:sh.val)}
  if(key==='page')return it.page==null||it.page==='all'?'all':String(it.page);
  return it[key];
}
function setProp(key,val){
  var w=S.wid,it=selItem();
  if(key==='doc.name'){w.name=val;return}if(key==='doc.author'){w.author=val;return}if(key==='doc.desc'){w.desc=val;return}
  if(key==='doc.bg'){w.bg=val;return}
  if(key==='doc.pages'){var n=+val;w.pages=n;w.items.forEach(function(x){if(x.page!=null&&x.page!=='all'&&x.page>=n)delete x.page});if(S.ed.page>=n)S.ed.page=0;return}
  if(key==='ed.snap'){S.ed.snap=+val;return}
  if(!it)return;
  if(key.indexOf('show.')===0){var k=key.slice(5),sh=it.show||{src:'',op:'>',val:0};sh[k]=k==='val'?+val:val;if(!sh.src)delete it.show;else it.show=sh;return}
  if(key==='page'){if(val==='all')delete it.page;else it.page=+val;return}
  if(key==='src'&&val==='none'){delete it.src;return}
  if(key==='font'||key==='align'||key==='action'||key==='icon'||key==='src'){it[key]=val;return}
  numChanged(it,key,val);
}
function wireStudio(){
  var q=function(sel,fn){[].forEach.call(document.querySelectorAll(sel),function(b){b.onclick=function(){fn(b)}})};
  q('[data-s]',function(b){
    var a=b.dataset.s,w=S.wid,E=S.ed,it=selItem();
    if(a==='close')closeStudio();else if(a==='open')openStudio();else if(a==='undo')undo();else if(a==='redo')redo();
    else if(a==='add'){E.add=!E.add;render();studioLoop()}
    else if(a==='anim'){E.anim=!E.anim;render();studioLoop()}else if(a==='lim'){E.limit=!E.limit;render();studioLoop()}
    else if(a==='dup'&&it){if(w.items.length>=NW.LIM.items)return;pushUndo();var n=cloneW(it);n.x=(n.x||0)+8;n.y=(n.y||0)+8;w.items.push(n);E.sel=w.items.length-1;render();studioLoop()}
    else if(a==='del'&&it){pushUndo();w.items.splice(E.sel,1);E.sel=-1;render();studioLoop()}
    else if(a==='front'&&it&&E.sel<w.items.length-1){pushUndo();var t=w.items[E.sel];w.items[E.sel]=w.items[E.sel+1];w.items[E.sel+1]=t;E.sel++;render();studioLoop()}
    else if(a==='back'&&it&&E.sel>0){pushUndo();var t2=w.items[E.sel];w.items[E.sel]=w.items[E.sel-1];w.items[E.sel-1]=t2;E.sel--;render();studioLoop()}
    else if(a==='clrwarn'&&it){pushUndo();delete it.warn;delete it.bad;delete it.below;render();studioLoop()}
    else if(a==='install'){var c=NW.compile(w);if(!c.ok){S.msg=c.errors[0];render();return}act(function(){return installWidget(w).then(function(){S.msg='Installeret på boardet.'})})}
    else if(a==='export')exportWidget();else if(a==='share')shareWidget();
    else if(a==='std'){pushUndo();S.wid=toV2(window.STARTERS[0]);E.sel=-1;E.page=0;render();studioLoop()}
    else if(a==='new'){pushUndo();S.wid={v:2,name:'Mit dashboard',author:w.author||'',desc:'',pages:1,bg:'bg',items:[cloneW(DEF2.arc),{t:'num',x:100,y:96,src:'speed',font:'8',align:'center',color:'text'}]};S.wid.items[1].y=82;E.sel=-1;E.page=0;render();studioLoop()}
  });
  q('[data-ad]',function(b){addItem(b.dataset.ad)});
  q('[data-sel]',function(b){S.ed.sel=+b.dataset.sel;var it=selItem();if(it){var pg=it.page==null||it.page==='all'?15:it.page;if(pg!==15)S.ed.page=pg}render();studioLoop();scrollPanel()});
  q('[data-pg]',function(b){S.ed.page=+b.dataset.pg;S.ed.sel=-1;render();studioLoop()});
  q('[data-c]',function(b){var it=selItem();if(!it)return;var i=b.dataset.c.indexOf(':');pushUndo();it[b.dataset.c.slice(0,i)]=b.dataset.c.slice(i+1);render();studioLoop()});
  q('[data-f]',function(b){var it=selItem();if(!it)return;pushUndo();var k=b.dataset.f;it[k]=!it[k];if(!it[k])delete it[k];render();studioLoop()});
  q('[data-nm]',function(b){var it=selItem();if(!it)return;var p=b.dataset.nm.split(':');pushUndo();numChanged(it,p[0],(+it[p[0]]||0)+(+p[1]));render();studioLoop()});
  q('[data-ng]',function(b){var it=selItem();if(!it)return;var p=b.dataset.ng.split(':');pushUndo();it.x=(+it.x||0)+(+p[0]);it.y=(+it.y||0)+(+p[1]);render();studioLoop()});
  q('[data-bgc]',function(b){pushUndo();S.wid.bg=b.dataset.bgc;render();studioLoop()});
  q('[data-pk]',function(b){var p=b.dataset.pk.split('|'),it=selItem();S.ed.sheet={key:p[0],title:p[1]||'',cur:getProp(p[0])};render();studioLoop()});
  q('[data-pv]',function(b){var sh=S.ed.sheet;if(!sh)return;var o=(PKO[sh.key]||[])[+b.dataset.pv];if(o===undefined)return;var v=Array.isArray(o)?o[0]:o;S.ed.sheet=null;pushUndo();setProp(sh.key,v);render();studioLoop()});
  q('[data-pc]',function(b){S.ed.sheet=null;render();studioLoop()});
  q('[data-sx]',function(b){});
  q('[data-nv]',function(b){var p=b.dataset.nv.split(':');var cur=getProp(p[0]);S.ed.sheet={kind:'num',key:p[0],min:+p[1],max:+p[2],title:p[3]||'Værdi',cur:cur==null?'':cur};render();studioLoop();setTimeout(focusSheet,60)});
  q('[data-tx]',function(b){var p=b.dataset.tx.split('|');var cur=getProp(p[0]);S.ed.sheet={kind:'text',key:p[0],max:+p[1],title:p[2]||'Tekst',cur:cur==null?'':cur};render();studioLoop();setTimeout(focusSheet,60)});
  q('[data-cc]',function(b){var key=b.dataset.cc,cur=getProp(key);S.ed.sheet={kind:'color',key:key,title:'Egen farve',cur:typeof cur==='string'&&cur.charAt(0)==='#'?cur:'#'};render();studioLoop();setTimeout(focusSheet,60)});
  q('[data-sv]',function(b){
    var K=S.ed.sheet,el=$('#sheetin');if(!K||!el)return;var r=String(el.value==null?'':el.value);
    if(K.kind==='num'){var n=parseFloat(r.replace(',','.'));if(isNaN(n)){S.msg='Skriv et tal';render();studioLoop();return}n=Math.max(K.min,Math.min(K.max,Math.round(n)));S.ed.sheet=null;pushUndo();setProp(K.key,n)}
    else if(K.kind==='color'){r=r.trim();if(r.charAt(0)!=='#')r='#'+r;if(!/^#[0-9a-fA-F]{6}$/.test(r)){S.msg='Farven skal skrives som #rrggbb, fx #33ccff';render();studioLoop();return}S.ed.sheet=null;pushUndo();setProp(K.key,r.toLowerCase())}
    else{r=r.replace(/[^\x20-\x7E]/g,'').slice(0,K.max||15);S.ed.sheet=null;pushUndo();setProp(K.key,r)}
    S.msg='';render();studioLoop()});
  var im=$('#wimport');if(im)im.onchange=async function(){try{var t=await im.files[0].text(),o=JSON.parse(t);var w2=toV2(o);var e=NW.compile(w2);S.wid=w2;S.wid.author=S.wid.author||'';S.ed.sel=-1;S.ed.page=0;S.ed.undo=[];S.msg=e.ok?'':'Filen har fejl: '+e.errors[0]}catch(x){S.msg='Kunne ikke læse filen'}render();studioLoop()};
  wireStudioCanvas();
}
function wireWidgets(){
  var q=function(sel,fn){[].forEach.call(document.querySelectorAll(sel),function(b){b.onclick=function(){fn(b)}})};
  q('[data-wi]',function(b){var p=b.dataset.wi.split(':'),w=(p[0]==='s'?S.gal:S.comm)[+p[1]];act(function(){return installWidget(w)})});
  q('[data-we]',function(b){var p=b.dataset.we.split(':'),w=(p[0]==='s'?S.gal:S.comm)[+p[1]];var n=toV2(w);n.author=n.author||'';openStudio(n)});
  q('[data-s]',function(b){if(b.dataset.s==='open')openStudio();else if(b.dataset.s==='reset')act(function(){return installWidget(window.STARTERS[0]).then(function(){S.msg='Standard-designet er sat på boardet igen.'})})});
}

(function(){var ok=false;try{var sv=typeof localStorage!=='undefined'&&localStorage.getItem('novaWid');if(sv){var w0=JSON.parse(sv);if(w0&&Array.isArray(w0.items)&&w0.items.length){S.wid=toV2(w0);ok=true}}}catch(e){}
  if(!ok&&window.STARTERS&&window.STARTERS.length)S.wid=toV2(window.STARTERS[0])})();
loadGallery();
render();
})();
</script>
</body>
